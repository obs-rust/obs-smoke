name: Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "obs-rust/obs-studio ref to build and test: 'main' (master HEAD), a release tag (e.g. 32.2.2), a branch or a commit SHA"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

env:
  SOURCE_REPO: obs-rust/obs-studio
  RESULTS_BRANCH: smoke-results

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.r.outputs.kind }}
      repo: ${{ steps.r.outputs.repo }}
      ref: ${{ steps.r.outputs.ref }}
      sha: ${{ steps.r.outputs.sha }}
      source_url: ${{ steps.r.outputs.source_url }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target || 'main' }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            main|master) ref=master; kind=main ;;
            *) ref="$TARGET"
               if gh api "repos/$SOURCE_REPO/git/ref/tags/$ref" >/dev/null 2>&1; then kind=release; else kind=ref; fi ;;
          esac
          sha=$(gh api "repos/$SOURCE_REPO/commits/$ref" --jq .sha)
          {
            echo "kind=$kind"
            echo "repo=$SOURCE_REPO"
            echo "ref=$ref"
            echo "sha=$sha"
            echo "source_url=https://github.com/$SOURCE_REPO/commit/$sha"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: Build Rust OBS (${{ matrix.os }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025-vs2026
            target: x64
          - os: macos
            runner: macos-26
            target: arm64
          - os: linux
            runner: ubuntu-26.04
            target: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out obs-rust/obs-studio
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.repo }}
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Check out obs-smoke
        uses: actions/checkout@v4
        with:
          path: .obs-smoke

      # The fork's full builds leave ENABLE_RUST_LIBOBS at its default (OFF).
      # Flip the default so the ported libobs internals come from Rust.
      - name: Enable Rust libobs
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak 's/option(ENABLE_RUST_LIBOBS \(".*"\) OFF)/option(ENABLE_RUST_LIBOBS \1 ON)/' libobs/CMakeLists.txt
          rm libobs/CMakeLists.txt.bak
          grep -n 'option(ENABLE_RUST_LIBOBS' libobs/CMakeLists.txt | grep -q ' ON)'
          git update-index --assume-unchanged libobs/CMakeLists.txt

      - name: Select Xcode
        if: matrix.os == 'macos'
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      # Corrosion runs cargo inside the CMake build; same setup as the fork's CI.
      - name: Set up soldr
        uses: zackees/setup-soldr@0f223ac68e97fccaaeab026ef1861e5bf73639ac # v0.9.85
        with:
          version: 0.9.31
          shims: true

      - name: Build OBS Studio
        uses: ./.github/actions/build-obs
        with:
          target: ${{ matrix.target }}
          config: RelWithDebInfo

      - name: Package OBS Studio
        uses: ./.github/actions/package-obs
        with:
          target: ${{ matrix.target }}
          config: RelWithDebInfo
          package: ${{ matrix.os != 'windows' }}

      - name: Collect package and verify Rust is linked
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p pkg
          case "${{ matrix.os }}" in
            windows) cp build_x64/obs-studio-*-windows-x64.zip pkg/ ;;
            macos)   cp build_macos/obs-studio-*-macos-apple.dmg pkg/ ;;
            linux)   cp $(ls build_ubuntu/obs-studio-*-x86_64-ubuntu-gnu.deb) pkg/ ;;
          esac
          lib=$(find build_* \( -name obs.dll -o -name 'libobs.so*' -o -path '*libobs.framework/Versions/A/libobs' \) -type f | head -1)
          echo "libobs: $lib"
          if grep -a -q '/rustc/' "$lib"; then rust=true; else rust=false; fi
          echo "Rust code linked into libobs: $rust"
          printf '{"rust_libobs": %s, "libobs_file": "%s", "built_sha": "%s"}\n' "$rust" "$(basename "$lib")" "$SHA" > pkg/build-info.json
          ls -la pkg
          [ "$rust" = true ]

      - uses: actions/upload-artifact@v4
        with:
          name: obs-rust-${{ matrix.os }}
          path: pkg/
          retention-days: 14

  smoke:
    name: Smoke (${{ matrix.os }})
    needs: build
    if: always() && needs.build.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025
          - os: macos
            runner: macos-26
          - os: linux
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download OBS build
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: obs-rust-${{ matrix.os }}
          path: dl

      - name: Record missing build
        if: steps.dl.outcome != 'success'
        run: |
          mkdir -p out
          printf '{"os": "${{ matrix.os }}", "status": "fail", "error": "Rust OBS build failed; nothing to run"}\n' > out/result.json
          exit 1

      - name: Install OBS (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            "$(ls "$PWD"/dl/*.deb | head -1)" \
            xvfb xauth imagemagick dbus-x11 libgl1-mesa-dri mesa-utils
          echo "OBS_EXE=$(command -v obs)" >> "$GITHUB_ENV"

      - name: Install OBS (macOS)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          dmg=$(ls dl/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/obsdmg "$dmg"
          app=$(ls -d /tmp/obsdmg/*.app | head -1)
          cp -R "$app" "$HOME/OBS.app"
          hdiutil detach /tmp/obsdmg
          xattr -cr "$HOME/OBS.app"
          echo "OBS_EXE=$HOME/OBS.app/Contents/MacOS/OBS" >> "$GITHUB_ENV"

      - name: Install OBS (Windows)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obs"
          unzip -q "$(ls dl/*.zip | head -1)" -d "$RUNNER_TEMP/obs"
          exe=$(find "$RUNNER_TEMP/obs" -name obs64.exe | head -1)
          echo "OBS_EXE=$(cygpath -w "$exe")" >> "$GITHUB_ENV"

      - name: Run OBS and screenshot
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = linux ]; then
            LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1920x1080x24" \
              dbus-run-session -- python3 scripts/run_obs.py --os linux --exe "$OBS_EXE" --out out
          else
            python scripts/run_obs.py --os "${{ matrix.os }}" --exe "$OBS_EXE" --out out
          fi
          cp dl/build-info.json out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: out/
          if-no-files-found: warn

  publish:
    name: Publish results
    needs: [resolve, build, smoke]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          path: in

      - name: Aggregate results
        env:
          SMOKE_TARGET: ${{ inputs.target || 'main' }}
          SMOKE_KIND: ${{ needs.resolve.outputs.kind }}
          SMOKE_REPO: ${{ needs.resolve.outputs.repo }}
          SMOKE_REF: ${{ needs.resolve.outputs.ref }}
          SMOKE_SHA: ${{ needs.resolve.outputs.sha }}
          SMOKE_SOURCE_URL: ${{ needs.resolve.outputs.source_url }}
        run: |
          set -euo pipefail
          python3 scripts/aggregate.py in results
          sudo apt-get install -y -q imagemagick >/dev/null
          shots=()
          for os in windows macos linux; do
            if [ -f "results/$os.png" ]; then
              shots+=("results/$os.png")
            else
              convert -size 1280x800 xc:'#222' -fill '#f85149' -pointsize 48 -gravity center \
                -annotate 0 "$os: no screenshot" "results/$os-missing.png"
              shots+=("results/$os-missing.png")
            fi
          done
          montage "${shots[@]}" -tile 3x1 -geometry 1280x800+8+8 -background '#111214' results/smoke.png
          rm -f results/*-missing.png

      - name: Push to results branch
        run: |
          set -euo pipefail
          cd results
          git init -q -b "$RESULTS_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > README.md <<EOF
          # Latest smoke run

          Overwritten by every run of the [Smoke workflow](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/smoke.yml).
          Code lives on \`main\`. See \`results.json\` for the structured data.

          ![OBS smoke screenshots](smoke.png)
          EOF
          git add -A
          git commit -q -m "Smoke results for run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$RESULTS_BRANCH"

      - name: Build site
        run: python3 scripts/build_site.py results site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail if any platform failed
        run: |
          status=$(python3 -c 'import json;print(json.load(open("results/results.json"))["status"])')
          echo "Overall: $status"
          [ "$status" = pass ]
